[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = . tests/helpers
addopts = -q -rs
markers =
    needs_rsync: needs the rsync binary (skipped when missing)
    needs_ssh: needs the ssh binary (skipped when missing)
    needs_btrfs: needs btrfs-progs installed (skipped when missing)
    needs_textual: needs the textual package (skipped when missing)
    needs_root_btrfs: needs root + mkfs.btrfs + a loop device + RESTORE_FUSION_E2E=1 (real hardware)
    hardware: real-hardware test, run by hand, never in the default run
